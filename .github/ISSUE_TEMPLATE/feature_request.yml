name: 功能建议
description: 建议主站体验、现有游戏玩法、无障碍或性能改进
title: "[Feature] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 建议区域
      options:
        - 主站与导航
        - 现有小游戏
        - 排行榜
        - 移动端与无障碍
        - 性能与资源体积
        - 贡献与部署流程
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先说明当前使用场景和不便，而不只是给出一个按钮名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可说明交互、视觉、兼容性和可能的取舍。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 Pull Request。
          required: true
        - label: 该建议不依赖来源不明的商业素材或远程追踪服务。
          required: true
