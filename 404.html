<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · Ciallo Web Games</title>
    <link rel="icon" href="/assets/icons/favicon.jpg" type="image/jpeg">
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #080a11; color: #f4f5f8; }
        main { padding: 40px; text-align: center; }
        .error-art { width: 162px; height: 162px; margin: 0 auto 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .12); border-radius: 28px; background: #05060a; box-shadow: 0 18px 48px rgba(255, 121, 187, .18); }
        .error-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
        h1 { margin: 12px 0; }
        p { color: #959bad; }
        a { display: inline-block; margin-top: 18px; padding: 11px 15px; border-radius: 12px; background: #f4f5f8; color: #090a10; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <div class="error-art">
            <img src="/assets/images/404-lost.gif" alt="404">
        </div>
        <h1>迷路了？</h1>
        <p>这里只有滚木...</p>
        <a href="/">返回首页</a>
    </main>
</body>
</html>
