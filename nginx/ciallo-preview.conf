# Private preview available only through an SSH tunnel.
server
{
    listen 127.0.0.1:18080;

    server_name localhost 127.0.0.1;

    root /var/www/ciallo.org.cn;
    index index.html;

    access_log /var/log/nginx/ciallo-preview.access.log;
    error_log /var/log/nginx/ciallo-preview.error.log;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(?:deploy|docs|nginx|scripts|server)(?:/|$)
    {
        deny all;
    }

    location ~ ^/(?:CODE_OF_CONDUCT|CONTRIBUTING|README|SECURITY)\.md$
    {
        deny all;
    }

    location ^~ /api/leaderboards/
    {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location /
    {
        try_files $uri $uri/ =404;
    }

    location = /404.html
    {
        internal;
    }

    location ~ /\.(?!well-known/)
    {
        deny all;
    }

    error_page 404 /404.html;
}
