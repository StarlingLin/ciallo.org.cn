# Production configuration.
# www.ciallo.org.cn redirects to the canonical ciallo.org.cn host.
server
{
    listen 80;
    listen [::]:80;

    server_name ciallo.org.cn www.ciallo.org.cn;

    root /var/www/ciallo.org.cn;

    location ^~ /.well-known/acme-challenge/
    {
        default_type "text/plain";
        try_files $uri =404;
        allow all;
    }

    location /
    {
        return 301 https://ciallo.org.cn$request_uri;
    }
}

server
{
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.ciallo.org.cn;

    ssl_certificate /etc/letsencrypt/live/ciallo.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciallo.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CIALLO_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://ciallo.org.cn$request_uri;
}

server
{
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ciallo.org.cn;

    root /var/www/ciallo.org.cn;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ciallo.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciallo.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CIALLO_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/ciallo.org.cn.access.log;
    error_log /var/log/nginx/ciallo.org.cn.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(?:deploy|docs|nginx|scripts|server)(?:/|$)
    {
        deny all;
    }

    location ~ ^/(?:CODE_OF_CONDUCT|CONTRIBUTING|README|SECURITY)\.md$
    {
        deny all;
    }

    location ^~ /api/leaderboards/
    {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location /
    {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|otf|wav|mp3|ogg|wasm|json)$
    {
        expires 7d;
        try_files $uri =404;
    }

    location = /404.html
    {
        internal;
    }

    location ~ /\.(?!well-known/)
    {
        deny all;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;
}
