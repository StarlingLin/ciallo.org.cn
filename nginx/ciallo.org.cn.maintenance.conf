# HTTP + HTTPS maintenance mode.
# This file requires an existing Let's Encrypt certificate.
server
{
    listen 80;
    listen [::]:80;

    server_name ciallo.org.cn www.ciallo.org.cn;

    root /var/www/ciallo.org.cn;

    access_log /var/log/nginx/ciallo.org.cn.access.log;
    error_log /var/log/nginx/ciallo.org.cn.error.log;

    error_page 503 /maintenance.html;

    location ^~ /.well-known/acme-challenge/
    {
        default_type "text/plain";
        try_files $uri =404;
        allow all;
    }

    location = /maintenance.html
    {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /assets/icons/favicon.jpg
    {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /assets/icons/beian.png
    {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /assets/images/maintenance-ciallo.gif
    {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /
    {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        return 503;
    }
}

server
{
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ciallo.org.cn www.ciallo.org.cn;

    root /var/www/ciallo.org.cn;

    ssl_certificate /etc/letsencrypt/live/ciallo.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ciallo.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CIALLO_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/ciallo.org.cn.access.log;
    error_log /var/log/nginx/ciallo.org.cn.error.log;

