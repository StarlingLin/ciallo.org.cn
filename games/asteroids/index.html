<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#060914">
    <title>起爆器危机</title>
    <link rel="stylesheet" href="game.css">
    <link rel="stylesheet" href="/assets/css/leaderboard.css?v=20260809-snake-details">
</head>
<body>
    <main class="space-app" aria-label="起爆器危机">
        <header class="game-header" aria-label="本局状态">
            <div class="stat-card">
                <span>得分</span>
                <strong id="score">000000</strong>
            </div>
            <div class="stat-card">
                <span>波次</span>
                <strong id="wave">01</strong>
            </div>
            <div class="stat-card lives-card">
                <span>体力</span>
                <strong id="lives" aria-label="剩余三点体力">♥ ♥ ♥</strong>
            </div>
        </header>

        <section class="stage" aria-label="游戏区域">
            <canvas id="game-canvas"
                    width="800"
                    height="500"
                    tabindex="0"
                    aria-label="帮助宁宁躲避起爆器并发射攻击。左右方向键或 A、D 转向，上方向键或 W 推进，空格射击。">
                当前浏览器不支持 Canvas。
            </canvas>

            <div class="stage-message" id="stage-message">
                <p class="message-kicker" id="message-kicker">0721</p>
                <strong id="message-title">宁宁，快跑！</strong>
                <p id="message-detail">躲开起爆器并把它们全部击碎</p>
                <button id="stage-action" type="button">开始逃生</button>
            </div>
        </section>

        <div class="game-controls" aria-label="游戏控制">
            <div class="flight-controls" aria-label="宁宁移动">
                <button class="control-button hold-button" id="left-button" type="button" aria-label="向左旋转">
                    <span aria-hidden="true">↶</span>
                    左转
                </button>
                <button class="control-button thrust-button hold-button" id="thrust-button" type="button" aria-label="向前推进">
                    <span aria-hidden="true">↑</span>
                    推进
                </button>
                <button class="control-button hold-button" id="right-button" type="button" aria-label="向右旋转">
                    右转
                    <span aria-hidden="true">↷</span>
                </button>
            </div>
            <div class="action-controls">
                <button class="control-button primary-button" id="fire-button" type="button">
                    <span aria-hidden="true">✦</span>
                    反击
                </button>
                <button class="control-button" id="pause-button" type="button">
                    <span aria-hidden="true">Ⅱ</span>
                    <span id="pause-label">暂停</span>
                </button>
                <button class="control-button" id="mute-button" type="button" aria-pressed="false">
                    <span id="mute-icon" aria-hidden="true">♪</span>
                    <span id="mute-label">声音开启</span>
                </button>
                <button class="control-button" id="reset-button" type="button">
                    <span aria-hidden="true">↻</span>
                    重新逃生
                </button>
            </div>
        </div>

        <footer class="game-footer">
            <p><kbd>←</kbd> <kbd>→</kbd> 转向，<kbd>↑</kbd> 推进，<kbd>Space</kbd> 射击，<kbd>P</kbd> 暂停</p>
            <span>宁宁主题换皮 · MIT 代码上游</span>
        </footer>
    </main>

    <div id="leaderboard-root" data-game-id="asteroids" data-game-name="起爆器危机"></div>
    <script src="/assets/js/leaderboard.js?v=20260809-snake-details"></script>
    <script src="game.config.js"></script>
    <script src="game.js"></script>
</body>
</html>
