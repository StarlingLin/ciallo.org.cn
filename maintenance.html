<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b12">
    <meta name="robots" content="noindex, nofollow">
    <title>站点维护中 · Ciallo</title>
    <link rel="icon" href="/assets/icons/favicon.jpg" type="image/jpeg">
    <style>
        :root
        {
            color-scheme: dark;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        *
        {
            box-sizing: border-box;
        }

        body
        {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            color: #f4f5f8;
            background:
                radial-gradient(circle at 76% 16%, rgba(142, 124, 255, 0.2), transparent 25rem),
                radial-gradient(circle at 25% 86%, rgba(255, 111, 181, 0.13), transparent 26rem),
                #07090f;
        }

        .page
        {
            width: min(620px, calc(100% - 40px));
            padding: 32px 0 24px;
            text-align: center;
        }

        .card
        {
            padding: clamp(40px, 8vw, 72px) clamp(26px, 7vw, 60px);
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 28px;
            background: rgba(15, 18, 29, 0.84);
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(18px);
        }

        .mark
        {
            width: 118px;
            height: 118px;
            margin: 0 auto 27px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 26px;
            overflow: hidden;
            background: #05060a;
            box-shadow: 0 15px 42px rgba(142, 124, 255, 0.3);
        }

        .mark img
        {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .eyebrow
        {
            margin: 0 0 12px;
            color: #9a9fb0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        h1
        {
            margin: 0;
            font-size: clamp(36px, 9vw, 62px);
            letter-spacing: -0.055em;
            line-height: 1.05;
        }

        p
        {
            max-width: 430px;
            margin: 21px auto 0;
            color: #a5aaba;
            font-size: 15px;
            line-height: 1.8;
        }

        .status
        {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 30px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            color: #cfd2dd;
            background: rgba(255, 255, 255, 0.035);
            font-size: 12px;
            text-decoration: none;
            transition:
                border-color 160ms ease,
                color 160ms ease,
                transform 160ms ease;
        }

        .status:hover,
        .status:focus-visible
        {
            border-color: rgba(255, 255, 255, 0.24);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .dot
        {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffca6b;
            box-shadow: 0 0 14px rgba(255, 202, 107, 0.7);
        }

        footer
        {
            padding-top: 25px;
            font-size: 12px;
        }

        .record-row,
        .public-security-record
        {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .record-row
        {
            flex-wrap: wrap;
            gap: 8px;
        }

        .public-security-record
        {
            gap: 5px;
        }

        .public-security-record img
        {
            width: 18px;
            height: 20px;
            object-fit: contain;
        }

        footer a
        {
            color: #8f95a7;
            text-decoration: none;
        }

        footer a:hover,
        footer a:focus-visible
        {
            color: #f4f5f8;
        }
    </style>
</head>
<body>
    <div class="page">
        <main class="card">
            <div class="mark">
                <img src="/assets/images/maintenance-ciallo.gif" alt="Ciallo 动态表情">
            </div>
            <p class="eyebrow">CIALLO · MAINTENANCE</p>
            <h1>站点维护中</h1>
            <p>Starling与GPT正在努力工作Ciallo～(∠・ω&lt; )⌒☆</p>
            <a class="status"
               href="https://www.starlinglin.top/"
               target="_blank"
               rel="noopener noreferrer">
                <span class="dot" aria-hidden="true"></span>
                <span>欢迎访问我的博客</span>
            </a>
        </main>

        <footer class="record-row">
            <a href="https://beian.miit.gov.cn/"
               target="_blank"
               rel="noopener noreferrer">苏ICP备2024128760号-2</a>
            <span aria-hidden="true">·</span>
            <a class="public-security-record"
               href="https://beian.mps.gov.cn/#/query/webSearch?code=32011102010924"
               target="_blank"
               rel="noopener noreferrer">
                <img src="/assets/icons/beian.png"
                     width="18"
                     height="20"
                     alt=""
                     aria-hidden="true">
                <span>苏公网安备32011102010924号</span>
            </a>
        </footer>
    </div>
</body>
</html>
